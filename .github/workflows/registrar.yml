name: registrar dólar
on:
  schedule:
    - cron: '7 * * * *'   # cada hora
  workflow_dispatch:
permissions:
  contents: write
jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/registrar.py datos
      - run: |
          git config user.name "bscambio-bot"
          git config user.email "bscambio-bot@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || git commit -m "datos: $(date -u +%F\ %H:%M)"
          git push
